# =========================================================
#  PlaytimeRewards - config.yml
#  Color code support via &.
#  Rewards can be freely added / edited / removed - just
#  follow the structure below, then run /pt reload.
# =========================================================

gui:
  title: "&6&lPlaytime Rewards"
  background-material: GRAY_STAINED_GLASS_PANE

settings:
  # After how many seconds of inactivity (no movement) a player is considered AFK
  afk-threshold-seconds: 120
  # How often (in minutes) player data is automatically saved
  autosave-interval-minutes: 5
  # Plays the ENTITY_PLAYER_LEVELUP sound when a reward is claimed
  sound-on-claim: true

# ---------------------------------------------------------
# Slots correspond to 4 rows of 4 candles centered inside a
# 6-row inventory (54 slots, 0-indexed):
#   row 1: 11, 12, 13, 14
#   row 2: 20, 21, 22, 23
#   row 3: 29, 30, 31, 32
#   row 4: 38, 39, 40, 41
# ---------------------------------------------------------
rewards:

  reward_30min:
    time_minutes: 30
    slot: 11
    icon:
      material: WHITE_CANDLE
      name: "&f30 Minutes"
      lore:
        - "&7Reward for &f%time% &7of playtime."
        - "&7Click to claim."
    claimed_icon:
      material: WHITE_CANDLE
      name: "&730 Minutes &a(Claimed)"
      lore:
        - "&7You have already claimed this reward."
    commands:
      - "give %player% bread 5"
    message: "&aYou claimed the &f%time% &aplaytime reward!"
    permission: ""
    broadcast: false

